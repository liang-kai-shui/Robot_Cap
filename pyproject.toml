[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-cap-v0"
version = "0.1.0"
description = "Measured Code-as-Policy robot agent prototype"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
robot-cap = "main:main"
robot-cap-benchmark = "benchmark:main"
robot-cap-navigation-benchmark = "navigation_benchmark:main"
robot-cap-mission-benchmark = "mission_benchmark:main"
robot-cap-robustness-benchmark = "robustness_benchmark:main"

[tool.setuptools]
py-modules = ["main", "benchmark", "navigation_benchmark", "mission_benchmark", "robustness_benchmark"]
packages = ["agent", "robot", "robot.backends", "runtime", "world", "task", "providers", "metrics", "config", "policy", "navigation"]

[tool.setuptools.package-data]
config = ["default.yaml"]
